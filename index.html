<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Al Sharif LPG - Master ERP</title>
    
    <style>
        /* ========================================================= */
        /* 📱 PREMIUM MOBILE APP UI (BLUE THEME)                     */
        /* ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&family=Inter:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; font-family: 'Inter', Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .ur { font-family: 'Jameel Noori Nastaleeq', 'Nafees Web Naskh', Tahoma; font-size: 18px; }
        .ur-bold { font-family: 'Jameel Noori Nastaleeq', 'Nafees Web Naskh', Tahoma; font-size: 20px; font-weight: bold; }
        
        body { margin: 0; padding: 0; background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .app-header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3); z-index: 50; }
        .app-header h1 { margin: 0; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 1px; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .app-screen { display: none; animation: fadeIn 0.3s ease; }
        .app-screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: #ffffff; border-radius: 16px; padding: 20px; margin-top: 30px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        
        /* UNIFORM BLUE THEME FOR ALL CARDS */
        .card-title { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 16px; border-radius: 12px; text-align: center; margin-top: -45px; margin-bottom: 25px; box-shadow: 0 12px 20px -5px rgba(37, 99, 235, 0.4); font-size: 24px; border: 3px solid #ffffff; display: flex; justify-content: center; align-items: center; gap: 10px; }

        .section-box { background:#f8fafc; border:1px solid #e2e8f0; padding:18px 15px 15px 15px; border-radius:12px; margin-top:30px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .section-title { background: linear-gradient(90deg, #ffffff, #eff6ff); padding: 8px 20px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; font-weight: bold; margin-bottom: 15px; margin-top: -35px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border-left: 1px solid #e2e8f0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        
        /* STANDARD BLUE SECTION TITLES */
        .st-blue { color: #1e3a8a; border-right: 5px solid #3b82f6; }
        
        /* KEEPING RED/GREEN FOR EXPENSES AND TOTALS AS STANDARD ACCOUNTING RULE */
        .st-red { color: #b91c1c; border-right: 5px solid #ef4444; }
        .st-green { color: #15803d; border-right: 5px solid #22c55e; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group select { padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; font-weight: bold; background: #ffffff; outline: none; transition: 0.3s; width: 100%; }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .auto-loaded { background: #eff6ff !important; border-color: #bfdbfe !important; color: #1e3a8a !important; }

        .live-summary { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; border-radius: 12px; padding: 18px; margin-top: 20px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .live-row { display: flex; justify-content: space-between; font-size: 16px; padding: 6px 0; border-bottom: 1px dashed #475569; }
        .live-row.total { font-size: 22px; font-weight: bold; color: #60a5fa; border: none; padding-top: 12px; margin-top: 8px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-pdf { padding: 14px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn-pdf:active { transform: scale(0.96); }
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

        .bottom-nav { background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 5px; position: fixed; bottom: 0; width: 100%; z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 13px; font-weight: bold; cursor: pointer; padding: 8px 20px; border-radius: 12px; transition: 0.3s; }
        .nav-item.active { color: #2563eb; background: #eff6ff; transform: translateY(-3px); }
        
        /* ========================================================= */
        /* 🖨️ PERFECT PRINT STYLES (BLUE THEME ONLY)                 */
        /* ========================================================= */
        #print-area { display: none; }
        @media print {
            body > *:not(#print-area) { display: none !important; }
            body { background: white; padding: 0; margin: 0; height: auto; overflow: visible; }
            #print-area { display: block !important; position: absolute; top: 0; left: 0; width: 100%; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            /* URDU PRINT */
            .p-ur { direction: rtl; font-family: 'Jameel Noori Nastaleeq', Tahoma, sans-serif; padding: 15px; }
            .p-ur-header.blue { background-color: #1e3a8a; color: white; text-align: center; padding: 20px; border-radius: 4px; margin-bottom: 15px; }
            .p-ur-header h1 { margin: 0; font-size: 32px; font-weight: normal; }
            .p-ur-header p { margin: 5px 0 0 0; font-size: 18px; }
            .p-ur-meta { display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; font-size: 18px; margin-bottom: 20px; }
            
            .p-ur-title.blue { font-size: 20px; font-weight: bold; padding-right: 10px; margin: 25px 0 10px 0; color: #1e3a8a; border-right: 4px solid #1e3a8a; }
            
            .p-ur table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 16px; }
            .p-ur th { padding: 10px; text-align: right; font-weight: bold; }
            .p-ur td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: right; }
            
            .p-ur.blue-theme th { border-bottom: 2px solid #1e3a8a; color: #1e3a8a; }
            
            .p-ur .sum-box { border: 1px solid #94a3b8; border-radius: 6px; padding: 15px; margin-top: 15px; background-color: #f8fafc; width: 70%; float: left; }
            .p-ur .s-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #cbd5e1; }
            .p-ur.blue-theme .s-total { background-color: #1e3a8a; color: white; padding: 12px; font-weight: bold; font-size: 20px; border-radius: 4px; margin-top: 10px; }
            .p-ur-circle { background: #1e3a8a; color: white; border-radius: 50%; width: 25px; height: 25px; display: inline-flex; justify-content: center; align-items: center; font-size: 14px; margin-left: 8px; font-family: 'Inter'; }

            /* ENGLISH PRINT */
            .p-en { direction: ltr; font-family: 'Inter', Arial, sans-serif; padding: 15px; }
            .p-en-header.blue { background-color: #1e3a8a; border-bottom: 6px solid #3b82f6; color: white; padding: 25px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
            .p-en-header h1 { margin: 0; font-size: 24px; text-transform: uppercase; }
            .p-en-header p { margin: 5px 0 0 0; font-size: 12px; opacity: 0.9; }
            .p-en-htitle { color: #bfdbfe; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
            .p-en-meta { display: flex; justify-content: space-between; margin: 20px 0; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; font-size: 13px; font-weight: bold; }
            .p-en-badge { background: #eff6ff; color: #1e3a8a; padding: 4px 8px; border-radius: 4px; margin-left: 8px; border: 1px solid #bfdbfe; }
            
            .p-en-title.blue { font-size: 13px; font-weight: bold; padding-left: 10px; margin: 25px 0 10px 0; text-transform: uppercase; color: #1e3a8a; border-left: 4px solid #3b82f6; }
            
            .p-en table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 13px; }
            .p-en th { padding: 10px; text-align: left; }
            .p-en.blue-theme th { background-color: #1e3a8a; color: white; }
            .p-en th.rt, .p-en td.rt { text-align: right; }
            .p-en td { border-bottom: 1px solid #e2e8f0; padding: 10px; }
            .p-en-sum-wrap { display: flex; gap: 20px; margin-top: 20px; }
            .p-en-note { width: 45%; font-size: 11px; color: #64748b; line-height: 1.5; }
            .p-en-box { width: 55%; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 15px; }
            .p-en-srow { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #cbd5e1; font-size: 13px; font-weight: bold; align-items: center; }

            .text-red { color: #dc2626 !important; font-weight: bold; }
            .text-green { color: #16a34a !important; font-weight: bold; }
            .clear { clear: both; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="ur-bold">الشریف ایل پی جی سسٹم</h1>
    </header>

    <main class="main-content">
        
        <!-- ========================================== -->
        <!-- 1. SHOP SCREEN                             -->
        <!-- ========================================== -->
        <div id="screen-shop" class="app-screen active">
            <div class="card">
                <h2 class="ur-bold card-title">🏪 دکان کا حساب کتاب</h2>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label class="ur">دکان کا نام</label>
                        <select id="s_name" class="ur" onchange="loadShopData()">
                            <option value="الشریف گیس شاپ">الشریف گیس شاپ</option>
                            <option value="نظامی روڈ شاپ">نظامی روڈ شاپ</option>
                            <option value="بادام بیکری">بادام بیکری</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="ur">تاریخ</label><input type="date" id="s_date"></div>
                </div>

                <div class="grid-2">
                    <div class="form-group"><label class="ur">وزن (Weight)</label>
                        <select id="s_weight" class="ur" onchange="calcLiveShop()">
                            <option value="45.4">45.4 KG</option>
                            <option value="45.2">45.2 KG</option>
                            <option value="45.0">45.0 KG</option>
                            <option value="1">ڈائریکٹ (بغیر وزن)</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="ur">ریٹ (Rs)</label><input type="number" id="s_rate" value="380" oninput="calcLiveShop()"></div>
                </div>

                <div class="section-box">
                    <span class="ur-bold section-title st-blue">📦 اسٹاک (تعداد)</span>
                    <div class="grid-2">
                        <div class="form-group"><label class="ur">پہلے سے موجود اسٹاک</label><input type="number" id="s_stock" value="0" class="auto-loaded" oninput="calcLiveShop()"></div>
                        <div class="form-group"><label class="ur">نیا لوڈ (سلنڈر)</label><input type="number" id="s_load" value="0" oninput="calcLiveShop()"></div>
                        <div class="form-group"><label class="ur">دکان کی سیل (سلنڈر)</label><input type="number" id="s_sale" value="0" oninput="calcLiveShop()"></div>
                        <div class="form-group"><label class="ur">ہوٹل / دیگر سپلائی</label><input type="number" id="s_h_sup" value="0" oninput="calcLiveShop()"></div>
                    </div>
                </div>

                <div class="section-box">
                    <span class="ur-bold section-title st-blue">💰 وصولی / جمع</span>
                    <div class="grid-2">
                        <div class="form-group"><label class="ur">پچھلا بقایا (Auto)</label><input type="number" id="s_prev" value="0" class="auto-loaded" oninput="calcLiveShop()"></div>
                        <div class="form-group"><label class="ur">کیش وصول کیا (+)</label><input type="number" id="s_cash_rcv" value="0" oninput="calcLiveShop()"></div>
                        <div class="form-group"><label class="ur">رقم جمع کروائی (-)</label><input type="number" id="s_jama" value="0" oninput="calcLiveShop()"></div>
                        <div class="form-group"><label class="ur">کس کو جمع کروائی؟</label><input type="text" class="ur" id="s_jama_name" placeholder="نام لکھیں"></div>
                    </div>
                </div>

                <div class="section-box">
                    <span class="ur-bold section-title st-red">📉 اخراجات (نقد)</span>
                    <div class="grid-2">
                        <div class="form-group"><input type="text" class="ur" id="e1_n" placeholder="خرچہ 1"><input type="number" id="e1_v" value="0" oninput="calcLiveShop()"></div>
                        <div class="form-group"><input type="text" class="ur" id="e2_n" placeholder="خرچہ 2"><input type="number" id="e2_v" value="0" oninput="calcLiveShop()"></div>
                        <div class="form-group"><input type="text" class="ur" id="c1_n" placeholder="کمیٹی 1"><input type="number" id="c1_v" value="0" oninput="calcLiveShop()"></div>
                        <div class="form-group"><input type="text" class="ur" id="c2_n" placeholder="کمیٹی 2"><input type="number" id="c2_v" value="0" oninput="calcLiveShop()"></div>
                    </div>
                    
                    <span class="ur-bold section-title st-red" style="margin-top:20px;">📝 ادھار گیس (KG لکھیں)</span>
                    <div class="grid-2">
                        <div class="form-group"><input type="text" class="ur" id="u1_n" placeholder="نام 1"><input type="number" id="u1_v" value="0" placeholder="وزن (KG)" oninput="calcLiveShop()"></div>
                        <div class="form-group"><input type="text" class="ur" id="u2_n" placeholder="نام 2"><input type="number" id="u2_v" value="0" placeholder="وزن (KG)" oninput="calcLiveShop()"></div>
                        <div class="form-group"><input type="text" class="ur" id="u3_n" placeholder="نام 3"><input type="number" id="u3_v" value="0" placeholder="وزن (KG)" oninput="calcLiveShop()"></div>
                        <div class="form-group"><input type="text" class="ur" id="u4_n" placeholder="نام 4"><input type="number" id="u4_v" value="0" placeholder="وزن (KG)" oninput="calcLiveShop()"></div>
                    </div>
                </div>

                <div class="live-summary">
                    <div class="live-row"><span class="ur">کل گراس سیل (<span id="live_s_cyl_count">0</span> سلنڈر):</span> <span id="live_s_gross" class="ur" style="color:#93c5fd;">0</span></div>
                    <div class="live-row total"><span class="ur">آج کا نیا بقایا:</span> <span id="live_s_net" class="ur">0</span></div>
                </div>

                <div class="btn-grid">
                    <button class="btn-pdf btn-blue ur-bold" onclick="printShopUrdu()">اردو بل (PDF)</button>
                    <button class="btn-pdf btn-blue" onclick="printShopEnglish()" style="font-family:'Inter', sans-serif;">English Bill (PDF)</button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 2. HOTEL SCREEN                            -->
        <!-- ========================================== -->
        <div id="screen-hotel" class="app-screen">
            <div class="card">
                <h2 class="ur-bold card-title">🏨 ہوٹل سپلائی کا حساب</h2>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label class="ur">ہوٹل کا نام (خود Save ہوگا)</label>
                        <input type="text" id="h_name" class="ur" list="hotel_list" placeholder="ہوٹل کا نام..." onchange="loadHotelData()">
                        <datalist id="hotel_list">
                            <option value="بسم اللہ ہوٹل"></option>
                            <option value="مدینہ ہوٹل"></option>
                        </datalist>
                    </div>
                    <div class="form-group"><label class="ur">تاریخ</label><input type="date" id="h_date"></div>
                </div>

                <div class="section-box">
                    <span class="ur-bold section-title st-blue">🛒 سپلائی اور ریٹ</span>
                    <div class="grid-2">
                        <div class="form-group"><label class="ur">وزن (Weight)</label>
                            <select id="h_weight" class="ur" onchange="calcLiveHotel()">
                                <option value="45.4">45.4 KG</option>
                                <option value="45.0">45.0 KG</option>
                                <option value="1">ڈائریکٹ (بغیر وزن)</option>
                            </select>
                        </div>
                        <div class="form-group"><label class="ur">ریٹ (Rs)</label><input type="number" id="h_rate" value="380" oninput="calcLiveHotel()"></div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group"><label class="ur">سپلائی (نئے سلنڈر)</label><input type="number" id="h_supply" value="0" oninput="calcLiveHotel()"></div>
                        <div class="form-group"><label class="ur">ادھار گیس (مقدار لکھیں)</label><input type="number" id="h_udhar" value="0" placeholder="Quantity/KG" oninput="calcLiveHotel()"></div>
                        <div class="form-group"><label class="ur">واپسی گیس (مقدار لکھیں)</label><input type="number" id="h_return" value="0" placeholder="Quantity/KG" oninput="calcLiveHotel()"></div>
                    </div>
                </div>

                <div class="section-box">
                    <span class="ur-bold section-title st-blue">💰 کیش اور بقایا</span>
                    <div class="grid-2">
                        <div class="form-group"><label class="ur">پچھلا بقایا (Auto)</label><input type="number" id="h_old_bal" value="0" class="auto-loaded" oninput="calcLiveHotel()"></div>
                        <div class="form-group"><label class="ur">کیش وصول کیا / جمع</label><input type="number" id="h_cash" value="0" oninput="calcLiveHotel()"></div>
                    </div>
                </div>

                <div class="section-box">
                    <span class="ur-bold section-title st-blue">🔄 خالی سلنڈر کا حساب</span>
                    <div class="grid-2">
                        <div class="form-group"><label class="ur">پہ
